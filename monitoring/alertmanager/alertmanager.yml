global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "paas-webhook-logger"

receivers:
  - name: "paas-webhook-logger"
    webhook_configs:
      - url: "http://host.docker.internal:3000/api/monitor/alerts"
        send_resolved: true

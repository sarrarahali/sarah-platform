<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Démo Statique - Sarah Platform</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      color: #1a202c;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      color: #4c51bf;
    }
    p {
      line-height: 1.6;
      color: #4a5568;
    }
    .badge {
      display: inline-block;
      background: #ebf4ff;
      color: #3182ce;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚀 Déploiement Réussi</div>
    <h1>Application Web Déployée</h1>
    <p>Félicitations ! Ce site web statique a été détecté et conteneurisé automatiquement via <strong>Nginx</strong> par <strong>Sarah Platform</strong>.</p>
    <p style="font-size: 0.85rem; color: #a0aec0;">Plateforme PaaS DevOps - Stage 2026</p>
  </div>
</body>
</html>

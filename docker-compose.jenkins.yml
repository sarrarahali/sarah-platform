services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: sarah-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8088:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sarah-network

networks:
  sarah-network:
    driver: bridge

volumes:
  jenkins_data:

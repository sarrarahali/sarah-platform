services:
  db:
    image: postgres:15-alpine
    container_name: sarah-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sarah_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sarah-network

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: sarah-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8088:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sarah-network

networks:
  sarah-network:
    driver: bridge

volumes:
  pgdata:
  jenkins_data:
